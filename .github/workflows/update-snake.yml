name: Update GitHub Contribution Snake

on:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: platane/snk@v1
        with:
          # GitHub username to fetch contributions for
          github_user_name: Krrish-GHub
          # Output GIF path inside the repo (will be committed)
          gif_out_path: snake.gif
          # Optional: output SVG path (not required)
          svg_out_path: snake.svg

      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snake.gif || true
          git commit -m "chore: update contribution snake" || echo "no changes to commit"
          git push || echo "push failed"
