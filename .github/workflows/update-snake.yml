name: Update GitHub Contribution Snake

on:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: platane/snk@v1
        with:
          # Output file inside the repo (will be committed)
          IMAGE_NAME: snake.gif
          # Choose a preset color or hex color (example: '#7c3aed')
          COLOR: '#7c3aed'
          # Size multiplier for the generated image (1 is default)
          MULTIPLIER: '1'

      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snake.gif || true
          git commit -m "chore: update contribution snake" || echo "no changes to commit"
          git push || echo "push failed"
