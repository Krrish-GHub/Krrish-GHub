name: Generate Colored Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate snake.gif
        run: |
          python scripts/generate_colored_snake.py Krrish-GHub snake.gif --neon '#7c3aed'

      - name: Commit snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snake.gif || true
          git commit -m "chore: update colored snake" || echo "no changes"
          git push || echo "push failed"
